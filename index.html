        const catIcons = {
            "Programación": "", "Redes": "🌐", "Seguridad": "🔒",
            "Hardware": "⚙️", "Software": "📱", "Bases de Datos": "️",
            "Inteligencia Artificial": "🤖"
        };

        const gridView = document.getElementById('list-view');
        const articleView = document.getElementById('article-view');
        const postsGrid = document.getElementById('postsGrid');
        const navList = document.getElementById('navList');
        const categoryHeader = document.getElementById('categoryHeader');

        function initMenu() {
            const categories = [...new Set(posts.map(p => p.category))].sort();
            categories.forEach(cat => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.textContent = cat;
                a.onclick = () => filterCategory(cat);
                a.id = `nav-${cat}`;
                li.appendChild(a);
                navList.appendChild(li);
            });
        }

        function renderPosts(filterCat = 'all') {
            postsGrid.innerHTML = '';
            const filtered = filterCat === 'all' ? posts : posts.filter(p => p.category === filterCat);

            if (filterCat !== 'all') {
                categoryHeader.style.display = 'flex';
                document.getElementById('catName').textContent = filterCat;
                document.getElementById('catIcon').textContent = catIcons[filterCat] || '📁';
            } else {
                categoryHeader.style.display = 'none';
            }

            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openArticle(post.id);
                card.innerHTML = `
                    <img src="${post.image}" alt="${post.title}" loading="lazy">
                    <div class="card-body">
                        <div class="card-meta">${post.category} • ${post.date}</div>
                        <div class="card-title">${post.title}</div>
                        <div class="card-excerpt">${post.content.replace(/<[^>]*>?/gm, '').substring(0, 80)}...</div>
                        <span class="read-btn">Leer artículo completo →</span>
                    </div>
                `;
                postsGrid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            const activeLink = document.getElementById(cat === 'all' ? 'nav-all' : `nav-${cat}`);
            if(activeLink) activeLink.classList.add('active');
            showListView();
            renderPosts(cat);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openArticle(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('art-img').src = post.image;
            document.getElementById('art-title').textContent = post.title;
            document.getElementById('art-date').textContent = post.date;
            document.getElementById('art-cat').textContent = post.category;
            document.getElementById('art-content').innerHTML = post.content;

            // Inyectar Schema.org dinámico para el artículo abierto
            injectArticleSchema(post);

            gridView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function injectArticleSchema(post) {
            // Eliminar schema anterior si existe
            const oldSchema = document.getElementById('dynamic-article-schema');
            if (oldSchema) oldSchema.remove();

            const schemaScript = document.createElement('script');
            schemaScript.type = 'application/ld+json';
            schemaScript.id = 'dynamic-article-schema';
            schemaScript.textContent = JSON.stringify(post.schema);
            document.head.appendChild(schemaScript);
        }

        function goBack() {
            showListView();
            // Eliminar schema dinámico al volver
            const oldSchema = document.getElementById('dynamic-article-schema');
            if (oldSchema) oldSchema.remove();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            articleView.style.display = 'none';
            gridView.style.display = 'block';
        }

        function resetView() {
            filterCategory('all');
        }

        initMenu();
        renderPosts('all');
    </script>
